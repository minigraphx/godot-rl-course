site_name: Godot RL Course
site_description: Learn deep reinforcement learning through Godot game environments
docs_dir: content

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list

nav:
  - Home: index.md
  - Setup: setup.md
  - Units:
    - "Unit 0: Setup & First Run": unit-00.md
    - "Unit 1: RL Foundations": unit-01.md
    - "Unit 2: Lunar Lander Build": unit-02.md
    - "Unit 3: CrossTheRoad & DQN": unit-03.md
    - "Unit 4: JumperHard & PPO": unit-04.md
    - "Unit 5: Parallel Training": unit-05.md
    - "Unit 6: Continuous 3D": unit-06.md
    - "Unit 7: Multi-Agent": unit-07.md
    - "Unit 8: Memory & POMDPs": unit-08.md
    - "Unit 9: Imitation Learning": unit-09.md
    - "Unit 10: Ship Your Brain": unit-10.md
  - Reference: reference.md
