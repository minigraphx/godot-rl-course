site_name: Godot RL Course
site_description: Learn deep reinforcement learning through Godot game environments
docs_dir: content

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_name: "Godot RL-Kurs"
          site_description: "Deep Reinforcement Learning mit Godot-Spielumgebungen lernen"
          nav_translations:
            Home: Startseite
            Setup: Einrichtung
            Reference: Referenz
            Guides: Anleitungen
            "Phase 1 — Foundations": "Phase 1 — Grundlagen"
            "Unit 0 — Setup & First Run": "Einheit 0 — Einrichtung & Erster Start"
            "Neural Foundations 1 — One Neuron": "Neuronale Grundlagen 1 — Ein Neuron"
            "Neural Foundations 2 — Tiny Networks": "Neuronale Grundlagen 2 — Kleine Netze"
            "RL Essentials": "RL Essentials"
            "Neural Foundations 3 — Learn from Reward": "Neuronale Grundlagen 3 — Aus Belohnung lernen"
            "RL Foundations Deep Dive": "RL Foundations Deep Dive"
            "Reward Engineering": "Belohnungsdesign"
            "Unit 2 — Build Your First Env": "Einheit 2 — Erste eigene Umgebung"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list

nav:
  - Home: index.md
  - Setup: setup.md
  - "Phase 1 — Foundations":
    - "Unit 0 — Setup & First Run": unit-00.md
    - "Neural Foundations 1 — One Neuron": unit-neural-01.md
    - "Neural Foundations 2 — Tiny Networks": unit-neural-02.md
    - "RL Essentials": unit-01.md
    - "Neural Foundations 3 — Learn from Reward": unit-neural-03.md
    - "RL Foundations Deep Dive": unit-rl-foundations-deep.md
    - "Reward Engineering": unit-reward-engineering.md
    - "Unit 2 — Build Your First Env": unit-02.md
  - "Phase 2 — Value-Based Methods":
    - "Q-Learning": unit-q-learning.md
    - "Deep Q-Learning (DQN)": unit-03.md
    - "Intrinsic Motivation & Curiosity": unit-curiosity.md
  - "Phase 3 — Policy-Based Methods":
    - "Policy Gradients & REINFORCE": unit-policy-gradients.md
    - "Actor-Critic": unit-actor-critic.md
    - "PPO Deep Dive": unit-ppo-deep.md
    - "PPO in Practice (JumperHard)": unit-04.md
    - "SAC — Soft Actor-Critic": unit-sac.md
    - "Apply It — SAC vs PPO on JumperHard": unit-sac-applied.md
    - "PPO From Scratch (CleanRL)": unit-cleanrl.md
  - "Phase 4 — Scale & Complexity":
    - "Parallel Training": unit-05.md
    - "Continuous 3D": unit-06.md
    - "Visual Observations": unit-visual-observations.md
    - "Multi-Agent": unit-07.md
    - "Memory & POMDPs": unit-08.md
    - "Self-Play": unit-self-play.md
    - "Hierarchical RL": unit-hierarchical.md
  - "Phase 5 — Beyond Reward":
