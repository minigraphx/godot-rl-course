name: Neural Foundations CI

on:
  pull_request:
    paths:
      - 'examples/neural_foundations/**'
      - 'examples/__init__.py'
      - 'scripts/test-neural-foundations.sh'
      - 'scripts/train_foundations_racer.py'
      - 'scripts/train-foundations-racer.sh'
      - 'scripts/verify_racer_policy.py'
      - 'requirements-course.txt'
      - '.github/workflows/neural-foundations-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/neural_foundations/**'
      - 'examples/__init__.py'
      - 'scripts/test-neural-foundations.sh'
      - 'scripts/train_foundations_racer.py'
      - 'scripts/train-foundations-racer.sh'
      - 'scripts/verify_racer_policy.py'
      - 'requirements-course.txt'
      - '.github/workflows/neural-foundations-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-course.txt

      - name: Install course Python dependencies
        run: pip install -r requirements-course.txt

      - name: Install Godot
        run: |
          GODOT_VERSION=4.3
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Run neural foundations tests
        env:
          SKIP_MKDOCS: '1'
        run: ./scripts/test-neural-foundations.sh
